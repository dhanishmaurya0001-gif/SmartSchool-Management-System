<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Private implementation/runtime paths must not be browsable.
    <DirectoryMatch "^/var/www/html/(application|system|private|backup|backups|temp|addons)(/|$)">
        AllowOverride None
        Require all denied
    </DirectoryMatch>

    # Uploads remain viewable, but cannot introduce executable server files.
    <Directory /var/www/html/uploads>
        Options -Indexes -ExecCGI
        AllowOverride None
        <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|cgi|pl|py|sh|shtml|sql|ini|log)(\.|$)">
            Require all denied
        </FilesMatch>
    </Directory>

    <FilesMatch "(?i)(^\.|\.(sql|sqlite|db|ini|log|bak|key|pem|env)$)">
        Require all denied
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
