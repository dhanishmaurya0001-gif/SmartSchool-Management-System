<VirtualHost *:RENDER_PORT>
    ServerName localhost
    DocumentRoot /var/www/html
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <DirectoryMatch "^/var/www/html/(application|system|private|backup|backups|temp|addons)(/|$)">
        AllowOverride None
        Require all denied
    </DirectoryMatch>
    <Directory /var/www/html/uploads>
        Options -Indexes -ExecCGI
        AllowOverride None
        <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|cgi|pl|py|sh|shtml|sql|ini|log)(\.|$)">
            Require all denied
        </FilesMatch>
    </Directory>
    <FilesMatch "(?i)(^\.|\.(sql|sqlite|db|ini|log|bak|key|pem|env)$)">
        Require all denied
    </FilesMatch>

    # Public demo visitors may exercise school operations, not installation,
    # source replacement, database restore/export or remote branch connections.
    <LocationMatch "(?i)^/(?:index\.php/)?(?:install(?:/|$)|admin/(?:addons|updater|multibranch)(?:/|$)|admin/admin/(?:backup|restore|downloadbackup|dropbackup|updateaddon|updateAddonVerify|updatePurchaseCode|addCronsecretkey|updateandappCode)(?:/|$))">
        Require all denied
    </LocationMatch>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} ^/index\.php$ [NC]
    RewriteCond %{QUERY_STRING} ^/?(?:install(?:/|$)|admin/(?:addons|updater|multibranch)(?:/|$)|admin/admin/(?:backup|restore|downloadbackup|dropbackup|updateaddon|updateAddonVerify|updatePurchaseCode|addCronsecretkey|updateandappCode)(?:/|$)) [NC]
    RewriteRule ^ - [F,L]

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
